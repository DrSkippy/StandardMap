[project]
name = "standard-map"
version = "0.1.0"
description = "Interactive Chirikov Standard Map visualization"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pygame>=2.5",
]

[project.scripts]
standard-map = "standard_map.app:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=standard_map --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["standard_map"]

[[tool.mypy.overrides]]
module = ["pygame.*", "scipy.*"]
ignore_missing_imports = true
